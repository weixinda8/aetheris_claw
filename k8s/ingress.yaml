apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aetheris-ingress
  namespace: aetheris
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
  - host: aetheris.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: aetheris
            port:
              name: http
