apiVersion: apps/v1
kind: Deployment
metadata:
  name: aetheris
  namespace: aetheris
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aetheris
  template:
    metadata:
      labels:
        app: aetheris
    spec:
      containers:
      - name: aetheris
        image: aetheris:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3000
          name: http
        envFrom:
        - configMapRef:
            name: aetheris-config
        - secretRef:
            name: aetheris-secret
        resources:
          requests:
            cpu: "500m"
            memory: "512Mi"
          limits:
            cpu: "1000m"
            memory: "1Gi"
        livenessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 3
        readinessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 3
