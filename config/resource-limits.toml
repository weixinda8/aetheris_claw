[rate_limiting]
# API 速率限制配置
enabled = true
requests_per_minute = 6000  # 100 requests per second
requests_per_hour = 60000
burst_size = 200

[task_throttling]
# 任务节流配置
enabled = true
max_concurrent_tasks = 100
max_queue_size = 500
task_timeout = "30m"

[resource_limits]
# 资源限制配置
max_memory_gb = 8.0
max_cpu_cores = 16.0
max_disk_usage_gb = 100.0

[worker_pool]
# 工作线程池配置
min_workers = 8
max_workers = 64
queue_size = 2000

[cache]
# 缓存配置
enabled = true
max_entries = 20000
ttl_seconds = 7200

[cache.l1]
# L1 缓存配置（内存）
enabled = true
max_size = 524288000  # 500MB
max_entries = 10000
ttl_seconds = 3600

[cache.l2]
# L2 缓存配置（磁盘）
enabled = true
max_size = 2147483648  # 2GB
max_files = 50000
ttl_seconds = 86400
