[package]
name = "aetheris-skill-hub"
version = "0.1.0"
edition = "2024"
description = "Aetheris Skill Hub - 独立的技能发现、评分和分发服务"
license = "MIT"
repository = "https://github.com/aetheris/aetheris-skill-hub"

[profile.dev]
opt-level = 0

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[dependencies]
tokio = { version = "1.47.1", features = ["full"] }
axum = { version = "0.8.4", features = ["ws"] }
tonic = "0.12.3"
sqlx = { version = "0.8.6", features = ["runtime-tokio", "postgres", "chrono", "json", "uuid", "migrate"] }
qdrant-client = "1.15.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "chrono"] }
tracing-opentelemetry = "0.28"
opentelemetry = { version = "0.29", features = ["trace", "metrics"] }
opentelemetry-otlp = { version = "0.29", features = ["tonic", "metrics"] }
opentelemetry-semantic-conventions = "0.29"
opentelemetry_sdk = { version = "0.29", features = ["trace", "metrics", "rt-tokio"] }
opentelemetry-prometheus = "0.31"
prometheus = "0.13"
anyhow = "1.0"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
futures = "0.3"
once_cell = "1.19"
async-trait = "0.1"
dashmap = { version = "6.0", features = ["serde"] }
parking_lot = "0.12"
bytes = "1.6"
http = "1.1"
http-body-util = "0.1"
tower = { version = "0.4", features = ["full"] }
prost = "0.13"
prost-types = "0.13"
num_cpus = "1.16"
regex = "1.10"
lazy_static = "1.4"
hex = "0.4"
sha2 = "0.10"
toml = "0.8"
serde_yaml = "0.9.34"
json5 = "0.4"
reqwest = { version = "0.12", features = ["json"] }
jsonwebtoken = "9.3"
rand = "0.8"
base64 = "0.22"
axum-extra = { version = "0.9", features = ["typed-header"] }
dotenvy = "0.15"
dirs = "5.0"
urlencoding = "2.1"
clap = { version = "4.5", features = ["derive"] }
bincode = "1.3"
bcrypt = "0.15"
semver = "1.0"
tinytemplate = "1.2"

[build-dependencies]
tonic-build = "0.12.3"

[features]
default = []
docker-tests = []
qdrant-tests = []

[dev-dependencies]
tempfile = "3.10"
criterion = "0.5"
cargo-llvm-cov = "0.6"
