version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: aetheris-skill-hub-postgres
    environment:
      POSTGRES_USER: aetheris_skill_hub
      POSTGRES_PASSWORD: aetheris_skill_hub_password
      POSTGRES_DB: aetheris_skill_hub
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/migrations:/docker-entrypoint-initdb.d
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aetheris_skill_hub"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aetheris-skill-hub-network

  qdrant:
    image: qdrant/qdrant:v1.8.2
    container_name: aetheris-skill-hub-qdrant
    ports:
      - "6334:6333"
      - "6335:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:6333/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - aetheris-skill-hub-network

  aetheris-skill-hub:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aetheris-skill-hub-app
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgresql://aetheris_skill_hub:aetheris_skill_hub_password@postgres:5432/aetheris_skill_hub
      QDRANT_URL: http://qdrant:6333
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 8080
      RUST_LOG: info
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/api/health || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - aetheris-skill-hub-network

volumes:
  postgres_data:
  qdrant_data:

networks:
  aetheris-skill-hub-network:
    driver: bridge
