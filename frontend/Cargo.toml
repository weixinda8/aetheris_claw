[package]
name = "aetheris-frontend"
version = "0.1.0"
edition = "2024"
description = "Aetheris Complex Task Execution Engine - Dioxus Frontend"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "aetheris-frontend"
path = "src/main.rs"

[dependencies]
dioxus = { version = "0.5", features = ["web"] }
dioxus-web = "0.5"
dioxus-router = "0.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["console"] }
gloo-net = "0.5"
gloo-storage = "0.3"
uuid = { version = "1.0", features = ["v4", "serde", "wasm-bindgen"] }
chrono = { version = "0.4", features = ["serde", "wasm-bindgen"] }
anyhow = "1.0"
thiserror = "2.0"
futures = "0.3"
async-trait = "0.1"
console_error_panic_hook = "0.1"

[profile.release]
lto = true
opt-level = "z"
strip = true
